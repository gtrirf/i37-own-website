upstream django_backend {
    server backend:8000;  # docker-compose servis nomi: backend
}

# --- Siqish (JSON, JS, CSS, SVG ...) — trafikni ~70% kamaytiradi ---
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types
    text/plain text/css text/xml application/json application/javascript
    application/xml application/rss+xml application/manifest+json
    image/svg+xml image/x-icon font/ttf font/otf;

server {
    listen 80;
    server_name api.i37.uz;

    client_max_body_size 50M;


    location / {
        proxy_pass http://django_backend;
        
        # Standart headerlar
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        
        # --- QO'SHILDI: Real IP va HTTPS ni aniqlash uchun ---
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # -----------------------------------------------------
        
        proxy_redirect off;
    }

    # 2. Statik fayllar
    location /static/ {
        alias /app/static/;
        # --- QO'SHILDI: CSS/JS turlarini to'g'ri aniqlash ---
        include /etc/nginx/mime.types;
        # --- QO'SHILDI: Tezlik uchun (Cache) ---
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # 3. Media fayllar (yangi yuklangan rasm har doim yangi nom oladi — uzoq kesh xavfsiz)
    location /media/ {
        alias /app/media/;
        include /etc/nginx/mime.types;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }
}

server {
    listen 8003;
    server_name i37.uz www.i37.uz;

    root /app/frontend/dist;
    index index.html;

    # SPA: index.html har doim yangi versiyani olishi kerak
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # Vite assetlari nomida hash bor — abadiy keshlash mumkin
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location /i37-favicon/ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    location = /favicon.ico {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
        log_not_found off;
    }
}
